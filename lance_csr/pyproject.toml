[project]
name = "graph-benchmark-lance-csr"
version = "0.1.0"
description = "lance-csr runs of the lance-graph query suite"
requires-python = ">=3.13"
dependencies = [
    "lance-csr==0.2.0",
    "polars==1.37.1",
    "pyarrow==23.0.0",
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
]

# Own project: lance-csr needs pylance 13, while the root project's lance-graph 0.5.4 uses pylance 1.0.4.
[tool.uv]
package = false
